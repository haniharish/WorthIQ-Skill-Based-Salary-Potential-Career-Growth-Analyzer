services:
  postgres:
    image: postgres:16-alpine
    container_name: worthiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worthiq_db}
      POSTGRES_USER: ${POSTGRES_USER:-worthiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worthiq_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - worthiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worthiq_user} -d ${POSTGRES_DB:-worthiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  worthiq_pgdata:
    name: worthiq_pgdata
