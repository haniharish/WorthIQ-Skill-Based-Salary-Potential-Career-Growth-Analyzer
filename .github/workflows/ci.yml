name: WorthIQ CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend for Production (Vite)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://worthiq-backend.onrender.com/api

  backend-ci:
    name: Backend System Checks & Automated Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worthiq_test_db
          POSTGRES_USER: worthiq_user
          POSTGRES_PASSWORD: worthiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worthiq_user -d worthiq_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Host PostgreSQL
        run: sudo systemctl stop postgresql || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Checks
        run: python manage.py check
        env:
          PYTHONPATH: ..
          SECRET_KEY: worthiq-ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://worthiq_user:worthiq_password@localhost:5432/worthiq_test_db
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Execute Backend Test Suite
        run: python manage.py test apps
        env:
          PYTHONPATH: ..
          SECRET_KEY: worthiq-ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://worthiq_user:worthiq_password@localhost:5432/worthiq_test_db
          ALLOWED_HOSTS: localhost,127.0.0.1

  docker-build-check:
    name: Docker Production Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: docker build -t worthiq-backend:test .
